workflows:
  - name: "register-user"
    flow: "register-user"
    method_ident: "four-fields"
    reset_email: true
    reset_online_id: true
    expected_tokens: [ "access-token" ]

  - name: "register-device"
    flow: "register-device"
    method_ident: "four-fields"
    device_registration_case: "new_device"
    expected_tokens: [ "access-token" ]

  - name: "login"
    flow: "login"
    method_auth: "fido-pin"
    expected_tokens: [ "access-token" ]

  - name: "login-wrong-pin"
    flow: "login"
    method_auth: "fido-pin"
    expected_actions: [ "ask-pin" ]

endpoint_interactions:
  - name: "get-profile"
    host: "idp"
    endpoint: "/api/profile"
    method: "GET"
    auth_config:
      type: "bearer"
    expected_status_code: 200

scenarios:
  - name: "register-then-login"
    description: "Register a user, add a device, then log in"
    supported_namespaces: [ "dev-main", "dev-pkv" ]
    labels: [ "auth", "smoke", "00000000-0000-0000-0000-d0c0ffee0001" ]
    sequence: [ "register-user", "register-device", "login" ]

  - name: "register-and-read-profile"
    description: "Register, log in and read the profile"
    supported_namespaces: [ "dev-main", "dev-pkv" ]
    labels: [ "auth", "profile", "00000000-0000-0000-0000-d0c0ffee0002" ]
    sequence: [ "register-user", "login", "get-profile" ]

  - name: "login-with-wrong-pin"
    description: "A wrong PIN must be rejected"
    supported_namespaces: [ "dev-main", "dev-pkv" ]
    labels: [ "auth", "negative", "demo-failing", "00000000-0000-0000-0000-d0c0ffee0003" ]
    sequence: [ "register-user", "login-wrong-pin" ]

  - name: "device-registration-only"
    description: "Register a device for an existing user"
    supported_namespaces: [ "dev-main", "dev-pkv" ]
    labels: [ "auth", "device", "00000000-0000-0000-0000-d0c0ffee0004" ]
    sequence: [ "register-user", "register-device" ]
